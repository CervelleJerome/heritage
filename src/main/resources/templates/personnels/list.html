<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Liste du Personnel Administratif</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="personnel-color">
                <i class="bi bi-person-badge me-2"></i> Liste du Personnel Administratif
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Personnel</li>
                </ol>
            </nav>
        </div>

        <div class="card border-personnel shadow-sm mb-4">
            <div class="card-header bg-personnel text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul me-2"></i> Personnel</span>
                <div>
                    <a th:href="@{/personnels/new}" class="btn btn-light btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Ajouter un personnel
                    </a>
                </div>
            </div>
            <div class="card-body">
                <!-- View toggle buttons -->
                <div class="btn-group view-toggle-group mb-3" role="group" aria-label="Changer de vue">
                    <button type="button" class="btn view-toggle-btn active" data-view="list">
                        <i class="bi bi-list-ul me-1"></i> Liste
                    </button>
                    <button type="button" class="btn view-toggle-btn" data-view="card">
                        <i class="bi bi-grid-3x3-gap me-1"></i> Cartes
                    </button>
                </div>

                <!-- List view -->
                <div class="list-container">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover border-personnel">
                            <thead class="bg-personnel">
                                <tr>
                                    <th><i class="bi bi-key me-1"></i> ID</th>
                                    <th><i class="bi bi-person me-1"></i> Nom</th>
                                    <th><i class="bi bi-person-vcard me-1"></i> Prénom</th>
                                    <th><i class="bi bi-geo-alt me-1"></i> Adresse</th>
                                    <th><i class="bi bi-telephone me-1"></i> Téléphone</th>
                                    <th><i class="bi bi-currency-euro me-1"></i> Prime</th>
                                    <th><i class="bi bi-gear me-1"></i> Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(personnels)}">
                                    <td colspan="7" class="text-center">
                                        <div class="alert alert-info">
                                            <i class="bi bi-info-circle me-2"></i> Aucun personnel trouvé
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="personnel : ${personnels}">
                                    <td th:text="${personnel.id}"></td>
                                    <td th:text="${personnel.nom}"></td>
                                    <td th:text="${personnel.prenom}"></td>
                                    <td th:text="${personnel.rue + ', ' + personnel.codePostal + ' ' + personnel.ville}"></td>
                                    <td th:text="${personnel.telephone}"></td>
                                    <td th:text="${personnel.prime}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/personnels/{id}/edit(id=${personnel.id})}" class="btn btn-sm btn-warning" 
                                               data-bs-toggle="tooltip" title="Modifier">
                                                <i class="bi bi-pencil-square"></i>
                                            </a>
                                            <a th:href="@{/personnels/{id}/delete(id=${personnel.id})}" class="btn btn-sm btn-danger" 
                                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce personnel?')"
                                               data-bs-toggle="tooltip" title="Supprimer">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Card view -->
                <div class="card-container d-none">
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                        <div class="col" th:each="personnel : ${personnels}">
                            <div class="card entity-card personnel-card h-100">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">
                                        <i class="bi bi-person me-2"></i>
                                        <span th:text="${personnel.prenom + ' ' + personnel.nom}"></span>
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <p class="card-text">
                                        <strong><i class="bi bi-key me-1"></i> ID:</strong> 
                                        <span th:text="${personnel.id}"></span>
                                    </p>
                                    <p class="card-text">
                                        <strong><i class="bi bi-geo-alt me-1"></i> Adresse:</strong> 
                                        <span th:text="${personnel.rue + ', ' + personnel.codePostal + ' ' + personnel.ville}"></span>
                                    </p>
                                    <p class="card-text">
                                        <strong><i class="bi bi-telephone me-1"></i> Téléphone:</strong> 
                                        <span th:text="${personnel.telephone}"></span>
                                    </p>
                                    <p class="card-text">
                                        <strong><i class="bi bi-currency-euro me-1"></i> Prime:</strong> 
                                        <span th:text="${personnel.prime}"></span>
                                    </p>
                                </div>
                                <div class="card-footer">
                                    <div class="d-flex justify-content-between">
                                        <a th:href="@{/personnels/{id}/edit(id=${personnel.id})}" class="btn btn-sm btn-warning" 
                                           data-bs-toggle="tooltip" title="Modifier">
                                            <i class="bi bi-pencil-square"></i> Modifier
                                        </a>
                                        <a th:href="@{/personnels/{id}/delete(id=${personnel.id})}" class="btn btn-sm btn-danger" 
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce personnel?')"
                                           data-bs-toggle="tooltip" title="Supprimer">
                                            <i class="bi bi-trash"></i> Supprimer
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-info mt-3" th:if="${#lists.isEmpty(personnels)}">
                        <i class="bi bi-info-circle me-2"></i> Aucun personnel trouvé
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">
                        <i class="bi bi-info-circle me-1"></i> 
                        <span th:text="${#lists.isEmpty(personnels) ? '0' : #lists.size(personnels)}"></span> personnel(s) trouvé(s)
                    </span>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-house me-1"></i> Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
