<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Liste du Personnel Administratif</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="personnel-color">Liste du Personnel Administratif</h1>

        <div class="mb-3">
            <a th:href="@{/personnels/new}" class="btn btn-personnel">Ajouter un personnel</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover border-personnel">
                <thead class="bg-personnel">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Adresse</th>
                        <th>Téléphone</th>
                        <th>Prime</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(personnels)}">
                        <td colspan="7" class="text-center">Aucun personnel trouvé</td>
                    </tr>
                    <tr th:each="personnel : ${personnels}">
                        <td th:text="${personnel.id}"></td>
                        <td th:text="${personnel.nom}"></td>
                        <td th:text="${personnel.prenom}"></td>
                        <td th:text="${personnel.rue + ', ' + personnel.codePostal + ' ' + personnel.ville}"></td>
                        <td th:text="${personnel.telephone}"></td>
                        <td th:text="${personnel.prime}"></td>
                        <td>
                            <a th:href="@{/personnels/{id}/edit(id=${personnel.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <a th:href="@{/personnels/{id}/delete(id=${personnel.id})}" class="btn btn-sm btn-danger" 
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce personnel?')">Supprimer</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
