<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="scripts">
        <!-- Bootstrap 5.3 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

        <!-- Optional: Add your custom scripts here -->
        <script th:src="@{/js/main.js(v=${#dates.format(#dates.createNow(), 'yyyyMMddHHmmss')})}"></script>
        <script>
            // Simple test to verify JavaScript is running
            console.log('Scripts loaded successfully at ' + new Date().toISOString());

            // Add a simple test function that doesn't depend on any other code
            window.testJavaScript = function() {
                alert('JavaScript is working!');
                return true;
            };

            // Check if Bootstrap is loaded
            if (typeof bootstrap !== 'undefined') {
                console.log('Bootstrap is loaded successfully');
            } else {
                console.error('Bootstrap is not loaded!');
            }
        </script>
    </div>
</body>
</html>
