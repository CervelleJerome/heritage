<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Liste des Étudiants</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="etudiant-color">
                <i class="bi bi-book me-2"></i> Liste des Étudiants
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Étudiants</li>
                </ol>
            </nav>
        </div>

        <div class="card border-etudiant shadow-sm mb-4">
            <div class="card-header bg-etudiant text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul me-2"></i> Étudiants</span>
                <div>
                    <a th:href="@{/etudiants/new}" class="btn btn-light btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Ajouter un étudiant
                    </a>
                </div>
            </div>
            <div class="card-body">
                <!-- View toggle buttons -->
                <div class="btn-group view-toggle-group mb-3" role="group" aria-label="Changer de vue">
                    <button type="button" class="btn view-toggle-btn active" data-view="list">
                        <i class="bi bi-list-ul me-1"></i> Liste
                    </button>
                    <button type="button" class="btn view-toggle-btn" data-view="card">
                        <i class="bi bi-grid-3x3-gap me-1"></i> Cartes
                    </button>
                </div>

                <!-- List view -->
                <div class="list-container">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover border-etudiant">
                            <thead class="bg-etudiant">
                                <tr>
                                    <th><i class="bi bi-key me-1"></i> ID</th>
                                    <th><i class="bi bi-person me-1"></i> Nom</th>
                                    <th><i class="bi bi-person-vcard me-1"></i> Prénom</th>
                                    <th><i class="bi bi-geo-alt me-1"></i> Adresse</th>
                                    <th><i class="bi bi-telephone me-1"></i> Téléphone</th>
                                    <th><i class="bi bi-cash-coin me-1"></i> Bourse</th>
                                    <th><i class="bi bi-gear me-1"></i> Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(etudiants)}">
                                    <td colspan="7" class="text-center">
                                        <div class="alert alert-info">
                                            <i class="bi bi-info-circle me-2"></i> Aucun étudiant trouvé
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="etudiant : ${etudiants}">
                                    <td th:text="${etudiant.id}"></td>
                                    <td th:text="${etudiant.nom}"></td>
                                    <td th:text="${etudiant.prenom}"></td>
                                    <td th:text="${etudiant.rue + ', ' + etudiant.codePostal + ' ' + etudiant.ville}"></td>
                                    <td th:text="${etudiant.telephone}"></td>
                                    <td th:text="${etudiant.bourse}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/etudiants/{id}/edit(id=${etudiant.id})}" class="btn btn-sm btn-warning" 
                                               data-bs-toggle="tooltip" title="Modifier">
                                                <i class="bi bi-pencil-square"></i>
                                            </a>
                                            <a th:href="@{/etudiants/{id}/delete(id=${etudiant.id})}" class="btn btn-sm btn-danger" 
                                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant?')"
                                               data-bs-toggle="tooltip" title="Supprimer">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Card view -->
                <div class="card-container d-none">
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                        <div class="col" th:each="etudiant : ${etudiants}">
                            <div class="card entity-card etudiant-card h-100">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">
                                        <i class="bi bi-person me-2"></i>
                                        <span th:text="${etudiant.prenom + ' ' + etudiant.nom}"></span>
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <p class="card-text">
                                        <strong><i class="bi bi-key me-1"></i> ID:</strong> 
                                        <span th:text="${etudiant.id}"></span>
                                    </p>
                                    <p class="card-text">
                                        <strong><i class="bi bi-geo-alt me-1"></i> Adresse:</strong> 
                                        <span th:text="${etudiant.rue + ', ' + etudiant.codePostal + ' ' + etudiant.ville}"></span>
                                    </p>
                                    <p class="card-text">
                                        <strong><i class="bi bi-telephone me-1"></i> Téléphone:</strong> 
                                        <span th:text="${etudiant.telephone}"></span>
                                    </p>
                                    <p class="card-text">
                                        <strong><i class="bi bi-cash-coin me-1"></i> Bourse:</strong> 
                                        <span th:text="${etudiant.bourse}"></span>
                                    </p>
                                </div>
                                <div class="card-footer">
                                    <div class="d-flex justify-content-between">
                                        <a th:href="@{/etudiants/{id}/edit(id=${etudiant.id})}" class="btn btn-sm btn-warning" 
                                           data-bs-toggle="tooltip" title="Modifier">
                                            <i class="bi bi-pencil-square"></i> Modifier
                                        </a>
                                        <a th:href="@{/etudiants/{id}/delete(id=${etudiant.id})}" class="btn btn-sm btn-danger" 
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant?')"
                                           data-bs-toggle="tooltip" title="Supprimer">
                                            <i class="bi bi-trash"></i> Supprimer
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-info mt-3" th:if="${#lists.isEmpty(etudiants)}">
                        <i class="bi bi-info-circle me-2"></i> Aucun étudiant trouvé
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">
                        <i class="bi bi-info-circle me-1"></i> 
                        <span th:text="${#lists.isEmpty(etudiants) ? '0' : #lists.size(etudiants)}"></span> étudiant(s) trouvé(s)
                    </span>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-house me-1"></i> Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
