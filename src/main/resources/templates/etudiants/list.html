<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Liste des Étudiants</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="etudiant-color">Liste des Étudiants</h1>

        <div class="mb-3">
            <a th:href="@{/etudiants/new}" class="btn btn-etudiant">Ajouter un étudiant</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover border-etudiant">
                <thead class="bg-etudiant">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Adresse</th>
                        <th>Téléphone</th>
                        <th>Bourse</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(etudiants)}">
                        <td colspan="7" class="text-center">Aucun étudiant trouvé</td>
                    </tr>
                    <tr th:each="etudiant : ${etudiants}">
                        <td th:text="${etudiant.id}"></td>
                        <td th:text="${etudiant.nom}"></td>
                        <td th:text="${etudiant.prenom}"></td>
                        <td th:text="${etudiant.rue + ', ' + etudiant.codePostal + ' ' + etudiant.ville}"></td>
                        <td th:text="${etudiant.telephone}"></td>
                        <td th:text="${etudiant.bourse}"></td>
                        <td>
                            <a th:href="@{/etudiants/{id}/edit(id=${etudiant.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <a th:href="@{/etudiants/{id}/delete(id=${etudiant.id})}" class="btn btn-sm btn-danger" 
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant?')">Supprimer</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
