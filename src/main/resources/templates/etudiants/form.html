<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${etudiant.id == null ? 'Ajouter un étudiant' : 'Modifier un étudiant'}"></title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="etudiant-color" th:text="${etudiant.id == null ? 'Ajouter un étudiant' : 'Modifier un étudiant'}"></h1>

        <form th:action="@{/etudiants}" th:object="${etudiant}" method="post" class="border-etudiant p-4 rounded">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control border-etudiant" id="nom" th:field="*{nom}" required />
            </div>

            <div class="mb-3">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" class="form-control border-etudiant" id="prenom" th:field="*{prenom}" required />
            </div>

            <div class="mb-3">
                <label for="rue" class="form-label">Rue</label>
                <input type="text" class="form-control border-etudiant" id="rue" th:field="*{rue}" required />
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="codePostal" class="form-label">Code Postal</label>
                    <input type="text" class="form-control border-etudiant" id="codePostal" th:field="*{codePostal}" required />
                </div>
                <div class="col-md-6">
                    <label for="ville" class="form-label">Ville</label>
                    <input type="text" class="form-control border-etudiant" id="ville" th:field="*{ville}" required />
                </div>
            </div>

            <div class="mb-3">
                <label for="telephone" class="form-label">Téléphone</label>
                <input type="text" class="form-control border-etudiant" id="telephone" th:field="*{telephone}" required />
            </div>

            <div class="mb-3">
                <label for="bourse" class="form-label">Bourse</label>
                <input type="number" step="0.01" class="form-control border-etudiant" id="bourse" th:field="*{bourse}" required />
            </div>

            <div class="mb-3">
                <button type="submit" class="btn btn-etudiant">Enregistrer</button>
                <a th:href="@{/etudiants}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
