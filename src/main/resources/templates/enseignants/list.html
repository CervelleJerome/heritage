<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Liste des Enseignants</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="enseignant-color">
                <i class="bi bi-mortarboard me-2"></i> Liste des Enseignants
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Enseignants</li>
                </ol>
            </nav>
        </div>

        <div class="card border-enseignant shadow-sm mb-4">
            <div class="card-header bg-enseignant text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul me-2"></i> Enseignants</span>
                <div>
                    <a th:href="@{/enseignants/new}" class="btn btn-light btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Ajouter un enseignant
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover border-enseignant">
                        <thead class="bg-enseignant text-white">
                            <tr>
                                <th><i class="bi bi-key me-1"></i> ID</th>
                                <th><i class="bi bi-person me-1"></i> Nom</th>
                                <th><i class="bi bi-person-vcard me-1"></i> Prénom</th>
                                <th><i class="bi bi-geo-alt me-1"></i> Adresse</th>
                                <th><i class="bi bi-telephone me-1"></i> Téléphone</th>
                                <th><i class="bi bi-clock-history me-1"></i> Heures Supp.</th>
                                <th><i class="bi bi-gear me-1"></i> Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(enseignants)}">
                                <td colspan="7" class="text-center">
                                    <div class="alert alert-info">
                                        <i class="bi bi-info-circle me-2"></i> Aucun enseignant trouvé
                                    </div>
                                </td>
                            </tr>
                            <tr th:each="enseignant : ${enseignants}">
                                <td th:text="${enseignant.id}"></td>
                                <td th:text="${enseignant.nom}"></td>
                                <td th:text="${enseignant.prenom}"></td>
                                <td>
                                    <span th:text="${enseignant.rue + ', ' + enseignant.codePostal + ' ' + enseignant.ville}"></span>
                                </td>
                                <td th:text="${enseignant.telephone}"></td>
                                <td th:text="${enseignant.heuresSupplementaires}"></td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/enseignants/{id}/edit(id=${enseignant.id})}" class="btn btn-sm btn-warning" 
                                           data-bs-toggle="tooltip" title="Modifier">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <a th:href="@{/enseignants/{id}/delete(id=${enseignant.id})}" class="btn btn-sm btn-danger" 
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet enseignant?')"
                                           data-bs-toggle="tooltip" title="Supprimer">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">
                        <i class="bi bi-info-circle me-1"></i> 
                        <span th:text="${#lists.isEmpty(enseignants) ? '0' : #lists.size(enseignants)}"></span> enseignant(s) trouvé(s)
                    </span>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-house me-1"></i> Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
